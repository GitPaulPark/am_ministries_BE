# Local-only MySQL for dev. Prod uses managed MySQL (NCP Cloud DB / RDS Seoul).
# Start: docker compose up -d  | Stop: docker compose down
services:
  mysql:
    image: mysql:8.4
    container_name: church-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-church}
      MYSQL_USER: ${MYSQL_USER:-church}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-church}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - church-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  church-mysql-data:
