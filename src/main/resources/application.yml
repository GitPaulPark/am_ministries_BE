spring:
  application:
    name: church-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      # 200MB ceiling lets a 60-min iPhone Voice Memo (.m4a) land — limit also
      # enforced (cheaper) at msc.ai.max-audio-mb before transferTo runs.
      max-file-size: 200MB
      max-request-size: 200MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  uploads:
    dir: ${UPLOADS_DIR:uploads}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:msc-church}
  access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
  refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}

cors:
  # 5173 is Vite's default; 5174 is auto-picked when 5173 is busy; 5180 is what
  # vite.config.js pins this project to. CORS_ALLOWED_ORIGINS env var overrides.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5180}

# Newcomer-graduation scheduler. Defaults match the module spec; override in tests
# (scheduler-enabled: false) or production env if you want a different cadence.
church:
  newcomer:
    graduation-after-weeks: 8
    suggestion-cron: "0 0 9 ? * MON"
    scheduler-enabled: true

# AI meeting pipeline (audio → transcript → topics).
# Disabled by default — opt in by setting MSC_AI_ENABLED=true and providing API
# keys. With enabled=true but no keys, the upload endpoint stays available; the
# orchestrator records a "not configured" failure so the UI can prompt for setup.
msc:
  ai:
    enabled: ${MSC_AI_ENABLED:false}
    uploads-dir: ${UPLOADS_DIR:uploads}
    max-audio-mb: 200
    prior-meetings-context: 8
    default-language: ko
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      model: whisper-large-v3
      timeout-seconds: 600
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-opus-4-7
      max-tokens: 16000
      effort: high
