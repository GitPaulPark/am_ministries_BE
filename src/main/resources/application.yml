spring:
  application:
    name: church-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  uploads:
    dir: ${UPLOADS_DIR:uploads}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:msc-church}
  access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
  refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}

cors:
  # 5173 is Vite's default; 5174 is auto-picked when 5173 is busy; 5180 is what
  # vite.config.js pins this project to. CORS_ALLOWED_ORIGINS env var overrides.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5180}
